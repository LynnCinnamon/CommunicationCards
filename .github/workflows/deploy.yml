# Builds the app and publishes it to GitHub Pages on every push to main.
# Nothing is deployed unless lint, tests and the build (which type-checks) pass.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows a manual run from the Actions tab

# Read the code, publish to Pages, and prove to Pages that this run is allowed to (id-token)
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push doesn't cancel one that's already publishing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci # Installs exactly what package-lock.json says
      - run: npm run lint
      - run: npm test -- --run # Without --run, Vitest would wait in watch mode
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
