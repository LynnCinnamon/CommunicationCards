<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Two fanned cards. Drawing order makes the front card look translucent:
       front card, then the back card over it, then the front card again at 50% opacity. -->
  <g stroke="#1d4ed8" stroke-width="12">
    <rect x="-120" y="-160" width="240" height="320" rx="28" fill="#ffffff"
      transform="translate(294.52 256) rotate(10)" />
    <rect x="-120" y="-160" width="240" height="320" rx="28" fill="#93c5fd"
      transform="translate(222.52 256) rotate(-10)" />
    <rect x="-120" y="-160" width="240" height="320" rx="28" fill="#ffffff" opacity="0.5"
      transform="translate(294.52 256) rotate(10)" />
  </g>
  <!-- "CC" as two open circle arcs (radius 40), so it renders the same without any font -->
  <g fill="none" stroke="#1d4ed8" stroke-width="22" stroke-linecap="round">
    <path d="M 240.56 233.89 A 40 40 0 1 0 240.56 295.09" />
    <path d="M 337.2 233.89 A 40 40 0 1 0 337.2 295.09" />
  </g>
</svg>
